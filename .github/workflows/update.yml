name: update-status
on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分鐘(GitHub cron 最短間隔;實際會被節流,詳見 README)
  workflow_dispatch:          # 也可手動 / 外部 cron 觸發
permissions:
  contents: write
concurrency:
  group: update-status
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓 itaipeiparking 官方站(w1/GetParks)產 status.json;失敗才退回 TCMSV
        run: |
          python3 - <<'PY'
          # itaipeiparking(台北市停管處官方站)後端 w1/GetParks:新鮮且每場站帶 updateTime
          # 需 CSRF token(首頁 hidden input)+ cookie,且無 CORS → 只能伺服器端抓(此處),瀏覽器不能直連
          import urllib.request, http.cookiejar, ssl, json, re, datetime, sys
          TPE='TPE0722'; NEARBY=['TPE1259','TPE1810']; LON,LAT='121.59294','25.05329'
          BASE='https://itaipeiparking.pma.gov.taipei'
          TCMSV='https://tcgbusfs.blob.core.windows.net/blobtcmsv/TCMSV_allavailable.xml'  # JSON 版自 2026-10-19 凍結,改讀 XML 版
          TZ=datetime.timezone(datetime.timedelta(hours=8))
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          UA='Mozilla/5.0 (compatible; yucheng-ev/1.0)'
          def _int(v):
              try: return int(v)
              except: return None
          def fetch_itp():
              cj=http.cookiejar.CookieJar()
              op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj),
                                             urllib.request.HTTPSHandler(context=ctx))
              html=op.open(urllib.request.Request(BASE+'/',headers={'User-Agent':UA}),timeout=40).read().decode('utf-8','ignore')
              m=re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"',html) or \
                re.search(r'value="([^"]+)"[^>]*name="__RequestVerificationToken"',html)
              if not m: raise RuntimeError('no CSRF token')
              url=f'{BASE}/w1/GetParks/{LON}/{LAT}/car/1'
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Content-Type':'application/json','X-CSRF-TOKEN':m.group(1)})
              arr=json.loads(op.open(req,timeout=40).read().decode('utf-8','ignore'))
              by={x.get('parkId'):x for x in arr if isinstance(x,dict)}
              p=by.get(TPE)
              if not p: raise RuntimeError('GetParks no '+TPE)
              g=_int(p.get('chargeStation'))
              return {'source':'itaipeiparking','updated':p.get('updateTime'),'live':True,
                'good':(g if g is not None else 0),'total':(_int(p.get('chargeStationTotalNum')) or 6),
                'carTotal':_int(p.get('carTotalNum')),'carAvail':_int(p.get('carRemainderNum')),
                'motorTotal':_int(p.get('motorTotalNum')),'motorAvail':_int(p.get('motorRemainderNum')),
                'hcAvail':_int(p.get('handicap_FirstRemainderNum')),
                'pgAvail':_int(p.get('pregnancy_FirstRemainderNum')),
                'hmAvail':_int(p.get('largeMotorRemainderNum')),
                'nearby':{i:(_int(by[i].get('carRemainderNum')) if i in by else None) for i in NEARBY},
                'builtAt':datetime.datetime.now(TZ).strftime('%Y-%m-%d %H:%M:%S')}
          def fetch_tcmsv():
              # 2026-11-09 起改讀 XML 版:TCMSV_allavailable.json 自 10-19 凍結未更新,XML 版仍每分鐘更新(欄位 1:1,PARK 子欄位大寫)
              import xml.etree.ElementTree as ET
              root=ET.fromstring(urllib.request.urlopen(urllib.request.Request(TCMSV,headers={'User-Agent':UA}),timeout=40,context=ctx).read())
              by={q.findtext('ID'):q for q in root.findall('PARK')}; p=by.get(TPE)
              if p is None: raise RuntimeError('TCMSV no '+TPE)
              lst=[(e.text or '').strip() for e in p.findall('ChargeStation/scoketStatusList/spot_status')]
              good=sum(1 for s in lst if s=='待機中')
              ut=(root.findtext('UPDATETIME') or '').strip(); mm=re.search(r'(\w{3}) +(\d+) (\d+):(\d+):\d+ \w+ (\d+)',ut)
              mon={'Jan':1,'Feb':2,'Mar':3,'Apr':4,'May':5,'Jun':6,'Jul':7,'Aug':8,'Sep':9,'Oct':10,'Nov':11,'Dec':12}
              upd=(f'{mm.group(5)}-{mon[mm.group(1)]:02d}-{int(mm.group(2)):02d} {mm.group(3)}:{mm.group(4)}' if mm else ut)
              g=lambda q,tag:(_int((q.findtext(tag) or '').strip()) if q is not None else None)
              return {'source':'TCMSV','updated':upd,'live':len(lst)>0,'good':good,'total':len(lst) or 6,
                'carTotal':293,'carAvail':g(p,'AVAILABLECAR'),'motorTotal':28,'motorAvail':g(p,'AVAILABLEMOTOR'),
                'hcAvail':g(p,'AVAILABLEHANDICAP'),'pgAvail':g(p,'AVAILABLEPREGNANCY'),'hmAvail':g(p,'AVAILABLEHEAVYMOTOR'),
                'nearby':{i:g(by.get(i),'AVAILABLECAR') for i in NEARBY},
                'builtAt':datetime.datetime.now(TZ).strftime('%Y-%m-%d %H:%M:%S')}
          try:
              data=fetch_itp()
          except Exception as e:
              sys.stderr.write('itaipeiparking failed, fallback TCMSV: %s\n'%e); data=fetch_tcmsv()
          open('status.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False))
          print(data)
          PY
      - name: 提交更新
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add status.json
          git diff --staged --quiet || (git commit -m "update status" && git push)
