name: update-status
on:
  schedule:
    - cron: '*/5 * * * *'   # 每 5 分鐘(GitHub cron 最短間隔;實際會被節流,詳見 README)
  workflow_dispatch:          # 也可手動 / 外部 cron 觸發
permissions:
  contents: write
concurrency:
  group: update-status
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓 itaipeiparking 官方站(w1/GetParks)產 status.json;失敗才退回 TCMSV
        run: |
          python3 - <<'PY'
          # itaipeiparking(台北市停管處官方站)後端 w1/GetParks:新鮮且每場站帶 updateTime
          # 需 CSRF token(首頁 hidden input)+ cookie,且無 CORS → 只能伺服器端抓(此處),瀏覽器不能直連
          import urllib.request, http.cookiejar, ssl, json, re, datetime, sys
          TPE='TPE0722'; NEARBY=['TPE1259','TPE1810']; LON,LAT='121.59294','25.05329'
          BASE='https://itaipeiparking.pma.gov.taipei'
          TCMSV='https://tcgbusfs.blob.core.windows.net/blobtcmsv/TCMSV_allavailable.json'
          TZ=datetime.timezone(datetime.timedelta(hours=8))
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          UA='Mozilla/5.0 (compatible; yucheng-ev/1.0)'
          def _int(v):
              try: return int(v)
              except: return None
          def fetch_itp():
              cj=http.cookiejar.CookieJar()
              op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj),
                                             urllib.request.HTTPSHandler(context=ctx))
              html=op.open(urllib.request.Request(BASE+'/',headers={'User-Agent':UA}),timeout=40).read().decode('utf-8','ignore')
              m=re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"',html) or \
                re.search(r'value="([^"]+)"[^>]*name="__RequestVerificationToken"',html)
              if not m: raise RuntimeError('no CSRF token')
              url=f'{BASE}/w1/GetParks/{LON}/{LAT}/car/1'
              req=urllib.request.Request(url,headers={'User-Agent':UA,'Content-Type':'application/json','X-CSRF-TOKEN':m.group(1)})
              arr=json.loads(op.open(req,timeout=40).read().decode('utf-8','ignore'))
              by={x.get('parkId'):x for x in arr if isinstance(x,dict)}
              p=by.get(TPE)
              if not p: raise RuntimeError('GetParks no '+TPE)
              g=_int(p.get('chargeStation'))
              return {'source':'itaipeiparking','updated':p.get('updateTime'),'live':True,
                'good':(g if g is not None else 0),'total':(_int(p.get('chargeStationTotalNum')) or 6),
                'carTotal':_int(p.get('carTotalNum')),'carAvail':_int(p.get('carRemainderNum')),
                'motorTotal':_int(p.get('motorTotalNum')),'motorAvail':_int(p.get('motorRemainderNum')),
                'hcAvail':_int(p.get('handicap_FirstRemainderNum')),
                'pgAvail':_int(p.get('pregnancy_FirstRemainderNum')),
                'hmAvail':_int(p.get('largeMotorRemainderNum')),
                'nearby':{i:(_int(by[i].get('carRemainderNum')) if i in by else None) for i in NEARBY},
                'builtAt':datetime.datetime.now(TZ).strftime('%Y-%m-%d %H:%M:%S')}
          def fetch_tcmsv():
              j=json.loads(urllib.request.urlopen(urllib.request.Request(TCMSV,headers={'User-Agent':UA}),timeout=40,context=ctx).read().decode('utf-8','ignore'))
              by={x.get('id'):x for x in j['data']['park']}; p=by.get(TPE)
              lst=((p.get('ChargeStation') or {}).get('scoketStatusList')) or []
              good=sum(1 for s in lst if s.get('spot_status')=='待機中')
              ut=j['data'].get('UPDATETIME',''); mm=re.search(r'(\w{3}) +(\d+) (\d+):(\d+):\d+ \w+ (\d+)',ut)
              mon={'Jan':1,'Feb':2,'Mar':3,'Apr':4,'May':5,'Jun':6,'Jul':7,'Aug':8,'Sep':9,'Oct':10,'Nov':11,'Dec':12}
              upd=(f'{mm.group(5)}-{mon[mm.group(1)]:02d}-{int(mm.group(2)):02d} {mm.group(3)}:{mm.group(4)}' if mm else ut)
              return {'source':'TCMSV','updated':upd,'live':len(lst)>0,'good':good,'total':len(lst) or 6,
                'carTotal':293,'carAvail':p.get('availablecar'),'motorTotal':28,'motorAvail':p.get('availablemotor'),
                'hcAvail':p.get('availablehandicap'),'pgAvail':p.get('availablepregnancy'),'hmAvail':p.get('availableheavymotor'),
                'nearby':{i:(by[i].get('availablecar') if i in by else None) for i in NEARBY},
                'builtAt':datetime.datetime.now(TZ).strftime('%Y-%m-%d %H:%M:%S')}
          try:
              data=fetch_itp()
          except Exception as e:
              sys.stderr.write('itaipeiparking failed, fallback TCMSV: %s\n'%e); data=fetch_tcmsv()
          open('status.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False))
          print(data)
          PY
      - name: 抓 itaipeiparking 路邊格(1.5km)產 roadside.json
        continue-on-error: true
        run: |
          python3 - <<'PY'
          # 路邊格 SelectType=5(逐格多邊形,remark=目前空格/有車停放/設備調整中),以指定點為中心多點查詢蓋 1.5km
          import urllib.request, http.cookiejar, ssl, json, re, math, datetime, sys
          LATc, LONc = 25.051995, 121.590969; RADIUS=1500
          BASE='https://itaipeiparking.pma.gov.taipei'
          TZ=datetime.timezone(datetime.timedelta(hours=8))
          ctx=ssl.create_default_context(); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE
          UA='Mozilla/5.0 (compatible; yucheng-ev/1.0)'
          DLAT=0.0072; DLON=0.0079
          CENTERS=[(LATc,LONc),(LATc+DLAT,LONc+DLON),(LATc+DLAT,LONc-DLON),(LATc-DLAT,LONc+DLON),(LATc-DLAT,LONc-DLON)]
          cj=http.cookiejar.CookieJar()
          op=urllib.request.build_opener(urllib.request.HTTPCookieProcessor(cj),urllib.request.HTTPSHandler(context=ctx))
          html=op.open(urllib.request.Request(BASE+'/',headers={'User-Agent':UA}),timeout=40).read().decode('utf-8','ignore')
          m=re.search(r'name="__RequestVerificationToken"[^>]*value="([^"]+)"',html)
          if not m: raise SystemExit('no CSRF token')
          tok=m.group(1)
          def getparks(lat,lon,tries=3):
              url=f'{BASE}/w1/GetParks/{lon}/{lat}/car/5'; last=None
              for _ in range(tries):
                  try:
                      req=urllib.request.Request(url,headers={'User-Agent':UA,'Content-Type':'application/json','X-CSRF-TOKEN':tok})
                      return json.loads(op.open(req,timeout=90).read().decode('utf-8','ignore'))
                  except Exception as e: last=e
              raise last
          def centroid(w):
              pts=re.findall(r'(-?\d+\.\d+) (-?\d+\.\d+)',w or '')
              if not pts: return None
              xs=[float(a) for a,b in pts]; ys=[float(b) for a,b in pts]
              return sum(ys)/len(ys), sum(xs)/len(xs)
          def dist(lat,lon): return math.hypot((lat-LATc)*110540,(lon-LONc)*math.cos(math.radians(LATc))*111320)
          seen=set(); bays=[]
          for lat,lon in CENTERS:
              try: arr=getparks(lat,lon)
              except Exception as e: sys.stderr.write('getparks fail %s\n'%e); continue
              for x in arr:
                  if not isinstance(x,dict): continue
                  c=centroid(x.get('wkt'))
                  if not c: continue
                  key=(round(c[0],5),round(c[1],5))
                  if key in seen: continue
                  seen.add(key)
                  if dist(*c)<=RADIUS: bays.append((c[0],c[1],x.get('parkName') or '',str(x.get('remark')),x.get('deviceUpdateTime')))
          vac=[b for b in bays if b[3]=='目前空格']
          dts=[b[4] for b in bays if b[4]]
          data={'center':[LATc,LONc],'radius':RADIUS,'updated':(max(dts) if dts else None),
                'vacant':len(vac),'occupied':sum(1 for b in bays if b[3]=='目前有車停放'),
                'offline':sum(1 for b in bays if b[3]=='設備調整中'),
                'spots':[[round(b[0],5),round(b[1],5),b[2]] for b in vac],
                'builtAt':datetime.datetime.now(TZ).strftime('%Y-%m-%d %H:%M:%S')}
          open('roadside.json','w',encoding='utf-8').write(json.dumps(data,ensure_ascii=False))
          print('roadside:',data['vacant'],'空格 /',len(bays),'格 @',data['updated'])
          PY
      - name: 提交更新
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add status.json roadside.json
          git diff --staged --quiet || (git commit -m "update status" && git push)
